<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    img {
      width: 100%;
      max-width: 300px;
    }

    button {
      background: red;
      color: white;
      border: none;
      padding: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<body>

<h1>🔥 Admin Dashboard</h1>
<a href="index.html">← Back to Home</a>

<div id="properties"></div>
<hr>

<h2>📅 Block Dates</h2>

<select id="propertySelect"></select>

<input id="adminDateRange" placeholder="Select date range" />

<button onclick="blockDates()">Block Dates</button>

<p id="adminStatus"></p>

<div id="editForm" style="display:none; background:#fff; padding:10px; border:1px solid #ccc;">
  <h3>Edit Property</h3>

  <input type="hidden" id="editId" />

  <input type="text" id="editTitle" placeholder="Title" />
  <input type="number" id="editPrice" placeholder="Price" />
  <input type="text" id="editLocation" placeholder="Location" />

  <input type="text" id="editImage" placeholder="Image URL" />

  <button onclick="updateProperty()">Save</button>
  <button onclick="closeEdit()">Cancel</button>
  <button class="edit" ...>Edit</button>
  <button class="delete" ...>Delete</button>
</div>

<script>  
    function editProperty(id, title, price, location, image) {
        document.getElementById("editForm").style.display = "block";

        document.getElementById("editId").value = id;
        document.getElementById("editTitle").value = title;
        document.getElementById("editPrice").value = price;
        document.getElementById("editLocation").value = location;
        document.getElementById("editImage").value = image;
        }

    function closeEdit() {
    document.getElementById("editForm").style.display = "none";
    }

    async function updateProperty() {
    try {
      const id = document.getElementById("editId").value;

      const updatedData = {
        title: document.getElementById("editTitle").value,
        price: Number(document.getElementById("editPrice").value),
        location: document.getElementById("editLocation").value,
        image: document.getElementById("editImage").value
      };

      const res = await fetch(`http://localhost:5000/admin/properties/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify(updatedData)
      });

      const data = await res.json();

      if (!res.ok) {
        return alert(data.message || "Update failed");
      }

      alert("Property updated!");
      closeEdit();
      loadProperties();

    } catch (err) {
      console.error(err);
      alert("Server error");
    }
  }

    
    const token = localStorage.getItem("token");

    // 🔴 PROTECT PAGE (if not logged in)
    if (!token) {
    alert("Please login first");
    window.location.href = "login.html";
    }

    // LOAD PROPERTIES
    async function loadProperties() {
    try {
        const res = await fetch("http://localhost:5000/admin/properties", {
        headers: {
            "Authorization": "Bearer " + token
        }
        });

        const data = await res.json();
        console.log("ADMIN DATA:", data);

        // 🔴 HANDLE ERROR RESPONSE
        if (!res.ok) {
        alert(data.message || "Access denied");
        return;
        }

        const container = document.getElementById("properties");
        container.innerHTML = "";
        const select = document.getElementById("propertySelect");
        select.innerHTML = "<option>Select Property</option>";

        if (!data || data.length === 0) {
          container.innerHTML = `
            <div style="text-align:center; padding:20px;">
              <h3>No properties found 🏠</h3>
            </div>
          `;
          return;
        }

        data.forEach(p => {
        const div = document.createElement("div");
        div.classList.add("card");

        const option = document.createElement("option");
        option.value = p._id;
        option.textContent = p.title;
        select.appendChild(option);

        div.innerHTML = `
            <img src="${p.image || 'https://via.placeholder.com/300'}" />
            <h3>${p.title}</h3>
            <p>${p.location}</p>
            <p>R ${p.price}</p>
            <button onclick="editProperty('${p._id}', '${p.title}', '${p.price}', '${p.location}', '${p.image || ''}')">
            <button onclick="deleteProperty('${p._id}')">Delete</button>
        `;

        container.appendChild(div);
        });

    } catch (error) {
        console.error("Error loading admin data:", error);
    }
    }

    // DELETE PROPERTY
    async function deleteProperty(id) {
    const confirmDelete = confirm("Are you sure you want to delete this property?");
    if (!confirmDelete) return;

    try {
        const res = await fetch("http://localhost:5000/admin/properties/" + id, {
        method: "DELETE",
        headers: {
            "Authorization": "Bearer " + token
        }
        });

        const data = await res.json();

        if (!res.ok) {
            const data = await res.json();
            return alert(data.message || "Failed to delete property");
        }

        alert("Property deleted");
        loadProperties();

    } catch (error) {
        console.error("Delete error:", error);
        alert("Server error occurred");
    }
    }

    // INIT
    loadProperties();

    flatpickr("#adminDateRange", {
      mode: "range",
      minDate: "today"
    });

async function blockDates() {
  const propertyId = document.getElementById("propertySelect").value;
  const range = document.getElementById("adminDateRange").value;
  const token = localStorage.getItem("token");

  if (!propertyId || !range) {
    return alert("Select property and dates");
  }

  const [start, end] = range.split(" to ");

  try {
    const res = await fetch("http://localhost:5000/admin/block-dates", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({
        propertyId,
        start,
        end
      })
    });

    const data = await res.json();

    document.getElementById("adminStatus").innerText =
      "✅ Dates blocked successfully";

  } catch (err) {
    console.error(err);
    document.getElementById("adminStatus").innerText =
      "❌ Error blocking dates";
  }
}

async function loadPropertyOptions() {
  const res = await fetch("http://localhost:5000/admin/properties", {
    headers: {
      "Authorization": "Bearer " + token
    }
  });

  const data = await res.json();

  const select = document.getElementById("propertySelect");

  data.forEach(p => {
    const option = document.createElement("option");
    option.value = p._id;
    option.textContent = p.title;
    select.appendChild(option);
  });
}

let adminSelectedDates = [];

function initAdminCalendar() {
  flatpickr("#adminDateRange", {
    mode: "range",
    minDate: "today",

    onChange: function (selected) {
      if (selected.length === 2) {
        adminSelectedDates = selected;
      }
    }
  });
}

loadPropertyOptions();
initAdminCalendar();
</script>

</body>
</html>
